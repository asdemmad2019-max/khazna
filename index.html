<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخزنة • KHAZNA | جمال وفخامة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFD700;--gold2:#D4AF37;--gold3:#FFF3A0;--bg:#050507;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--mut:#A8A8B5}
*{box-sizing:border-box;font-family:'Cairo','Tajawal',sans-serif}
body{margin:0;background:var(--bg);color:#fff;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(1000px 500px at 85% -10%,rgba(255,215,0,.22),transparent 60%),radial-gradient(800px 500px at 5% 30%,rgba(212,175,55,.14),transparent 60%),radial-gradient(700px 500px at 50% 110%,rgba(255,215,0,.1),transparent 60%);pointer-events:none;z-index:0}
.top{position:relative;z-index:3;background:linear-gradient(90deg,#FFD700,#FFF3A0,#FFD700,#D4AF37);background-size:200% 100%;animation:shine 4s linear infinite;color:#000;text-align:center;padding:10px 12px;font-weight:900;font-size:13px;letter-spacing:.2px}
@keyframes shine{to{background-position:200% 0}}
header{position:sticky;top:0;z-index:40;background:rgba(5,5,7,.82);backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--line);padding:13px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:26px}
.logo-mark{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#FFD700,#FFF3A0,#B8860B);display:grid;place-items:center;font-size:24px;box-shadow:0 10px 30px rgba(255,215,0,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.logo small{display:block;font-size:10px;letter-spacing:4px;color:var(--mut);font-weight:700}
nav{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
nav button{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:700;transition:.2s}
nav button:hover{transform:translateY(-2px);border-color:rgba(255,215,0,.6)}
nav button.on{background:linear-gradient(135deg,#FFD700,#FFB800);color:#000;border-color:#FFD700;box-shadow:0 6px 20px rgba(255,215,0,.35)}
.wrap{max-width:1240px;margin:auto;padding:20px;position:relative;z-index:1}
.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,#FFD700,#FFF3A0,#FFB800);background-size:200% 100%;color:#000;border:0;padding:15px 26px;border-radius:16px;font-weight:900;cursor:pointer;font-size:16px;box-shadow:0 12px 32px rgba(255,215,0,.35),inset 0 1px 0 rgba(255,255,255,.7);transition:.25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(255,215,0,.45);background-position:100% 0}
.btn:active{transform:translateY(0) scale(.98)}
.btn-g{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#fff;padding:14px 22px;border-radius:16px;font-weight:800;cursor:pointer;backdrop-filter:blur(10px);transition:.25s}
.btn-g:hover{transform:translateY(-2px);border-color:#FFD700;color:#FFD700;background:rgba(255,215,0,.08)}
.btn-sm{padding:10px 18px;font-size:14px;border-radius:12px}
.btn-full{width:100%}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin-top:16px}
.hero-card{background:linear-gradient(135deg,rgba(255,215,0,.18),rgba(255,255,255,.03));border:1px solid rgba(255,215,0,.3);border-radius:30px;padding:34px;position:relative;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.hero-card:after{content:"◆";position:absolute;left:-10px;bottom:-35px;font-size:180px;opacity:.05}
.hero h1{font-size:52px;line-height:1.05;margin:12px 0;font-weight:900;letter-spacing:-.5px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#FFD700,#FFF3A0,#FFD700);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite}
.hero p{color:#CFCFD8;line-height:1.95;font-size:16px}
.pill{display:inline-flex;gap:8px;align-items:center;background:rgba(0,0,0,.4);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700}
.pill i{width:8px;height:8px;background:#00E676;border-radius:50%;box-shadow:0 0 0 4px rgba(0,230,118,.2);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,230,118,.4)}100%{box-shadow:0 0 0 10px rgba(0,230,118,0)}}
.glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);border-radius:26px;padding:22px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:18px}
.mini div{background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:20px;padding:15px;text-align:center}
.mini b{display:block;font-size:16px}
.mini span{color:var(--mut);font-size:12px;line-height:1.6}
.sec{margin:34px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:29px;font-weight:900}
.sec-head h2:after{content:"";display:block;width:60px;height:4px;background:linear-gradient(90deg,#FFD700,transparent);border-radius:999px;margin-top:8px}
.sec-head p{color:var(--mut);margin:8px 0 0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:16px;margin-top:16px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:24px;padding:22px;position:relative;transition:.3s;overflow:hidden}
.card:hover{transform:translateY(-6px);border-color:rgba(255,215,0,.55);box-shadow:0 24px 48px rgba(0,0,0,.45),0 0 0 1px rgba(255,215,0,.2)}
.card:before{content:"";position:absolute;top:0;right:0;left:0;height:1px;background:linear-gradient(90deg,transparent,#FFD700,transparent)}
.ic{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,rgba(255,215,0,.28),rgba(255,215,0,.05));border:1px solid rgba(255,215,0,.32);display:grid;place-items:center;font-size:27px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.card h3{margin:13px 0 7px;font-size:20px;font-weight:900}
.card p{color:var(--mut);line-height:1.8;font-size:14px}
.tag{position:absolute;top:16px;left:16px;background:linear-gradient(135deg,#FFD700,#FFB800);color:#000;font-size:11px;font-weight:900;padding:6px 11px;border-radius:999px;box-shadow:0 6px 16px rgba(255,215,0,.35)}
.bar{height:7px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin-top:13px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD700,#FFF3A0);border-radius:999px}
input,select,textarea{width:100%;padding:14px 15px;border-radius:15px;border:1px solid rgba(255,255,255,.13);background:rgba(0,0,0,.45);color:#fff;margin:7px 0;outline:none;transition:.2s;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:#FFD700;box-shadow:0 0 0 4px rgba(255,215,0,.14);transform:translateY(-1px)}
.alert{background:rgba(255,215,0,.09);border:1px solid rgba(255,215,0,.28);padding:14px;border-radius:18px;font-size:13px;line-height:1.75}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}
.tabs button{padding:11px 19px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-weight:700;transition:.2s}
.tabs button:hover{transform:translateY(-1px)}
.tabs button.on{background:linear-gradient(135deg,#FFD700,#FFB800);color:#000;box-shadow:0 8px 20px rgba(255,215,0,.3)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);backdrop-filter:blur(10px);z-index:60;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.modal.open{display:flex}
.box{background:#121216;border:1px solid rgba(255,255,255,.13);border-radius:26px;padding:26px;width:100%;max-width:680px;margin:auto;box-shadow:0 40px 90px rgba(0,0,0,.65)}
.box.wide{max-width:940px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi div{flex:1;min-width:130px;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:16px;border-radius:20px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi span{color:var(--mut);font-size:12px}
.badge{padding:6px 11px;border-radius:999px;font-size:11px;font-weight:800}
.b-ok{background:#12331F;color:#7BE3A8}.b-wait{background:#3A2A00;color:#FFD27A}.b-no{background:#3A1212;color:#FF9A9A}
.switch{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:14px;border-radius:18px;margin:9px 0}
footer{border-top:1px solid var(--line);padding:26px 16px;text-align:center;color:var(--mut);font-size:13px;line-height:1.9;position:relative;z-index:1}
.chart{display:flex;align-items:flex-end;gap:9px;height:115px;margin-top:14px}
.chart i{flex:1;background:linear-gradient(180deg,#FFD700,rgba(255,215,0,.12));border-radius:12px 12px 5px 5px;min-height:20px}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.timeline b{font-size:30px;color:#FFD700}
.icon-row{display:flex;gap:8px;flex-wrap:wrap}
.icon-row button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:20px;cursor:pointer;transition:.2s}
.icon-row button:hover{transform:translateY(-2px);border-color:#FFD700}
.faq details{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:15px;margin:9px 0}
.faq summary{cursor:pointer;font-weight:800}
.faq p{color:var(--mut);line-height:1.85}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FFD700,#FFB800);color:#000;padding:13px 22px;border-radius:999px;font-weight:900;z-index:100;display:none;box-shadow:0 12px 32px rgba(0,0,0,.5)}
@media(max-width:860px){.hero{grid-template-columns:1fr}.hero h1{font-size:34px}.row{grid-template-columns:1fr}.mini{grid-template-columns:1fr}.timeline{grid-template-columns:1fr 1fr}}
